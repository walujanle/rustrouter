name: CI

# Gate every push and pull request on the same checks a release depends on:
# formatting, lints, tests and the frontend build. The release workflow only
# runs on a tag, so without this a broken commit can sit on the branch until a
# release is attempted.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned to match rust-toolchain.toml, so CI does not float on `stable`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # aws-lc-sys (the rustls backend) compiles C and assembly with cmake.
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - name: Assert every manifest agrees with PROJECT_VERSION
        run: node scripts/set-version.mjs --check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The declared floor (`rust-version` in Cargo.toml, 1.88) is otherwise never
  # exercised: the `rust` job pins 1.97.1 and the Dockerfile is the only 1.88
  # build. `check` is enough to catch an MSRV break without a second full build.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      # `+1.88.0` overrides `rust-toolchain.toml` (which pins 1.97.1).
      - run: cargo +1.88.0 check --workspace

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # `npm run build` is vue-tsc -b, then biome check, then vite build.
      - run: npm run build
        working-directory: web

  audit:
    runs-on: ubuntu-24.04
    # Advisory-only. A published advisory is not this project's bug, and a hard
    # failure here would block every dependency-bump PR the moment one lands.
    # The job still shows red so the advisory stays visible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --audit-level=high
        working-directory: web
