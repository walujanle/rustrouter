[package]
name = "router-sse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Provider registry, translators, executors and the chat pipeline. No HTTP."

[dependencies]
async-stream.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
dashmap.workspace = true
futures.workspace = true
hex = "0.4.3"
indexmap = { workspace = true, features = ["serde"] }
rand = "0.10.3"
regex.workspace = true
reqwest = { workspace = true, default-features = false, features = ["rustls", "http2", "json", "multipart", "socks", "stream", "charset", "gzip", "brotli", "deflate", "zstd", "cookies", "system-proxy", "query", "form"] }
router-db.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.11.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "fs", "process", "net", "macros", "rt-multi-thread"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
