[package]
name = "rustrouter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "rustrouter binary"

[[bin]]
name = "rustrouter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono.workspace = true
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
# Raw-mode keyboard input for the interactive terminal UI. Hand-rolling raw mode
# plus key decoding on Windows and Unix is the exact bug farm this crate exists
# to remove.
crossterm = "0.29.0"
# Global allocator. Pinned exactly: libmimalloc-sys 0.1.47 (mimalloc 3.3.1)
# crashes on aarch64-pc-windows-msvc, 0.1.49 (3.3.2) carries the upstream fix.
mimalloc = "=0.1.52"
# The TUI talks to the running server over the same HTTP API the dashboard uses,
# with the `x-9r-cli-token` header. Blocking client: the TUI owns the main
# thread, the tokio runtime lives on the server thread.
reqwest = { workspace = true, default-features = false, features = ["blocking", "json"] }
router-db.workspace = true
router-server.workspace = true
router-sse.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "fs", "process", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
# Parsing the callback URL the user pastes back after an OAuth login.
url.workspace = true
